name: Build and Deploy to S3

on:
  push:
    branches: [main]
  workflow_dispatch:
  # SOUNDING lives in its own repository but ships from here, so a merge over
  # there has to be able to wake this. Its workflow sends this event; only the
  # `sounding` job answers it (see the guards below), because rebuilding the
  # site for a change to the game would re-run the Bedrock summarisation step
  # and pay for it.
  repository_dispatch:
    types: [sounding-updated]

permissions:
  contents: read
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    if: github.event_name != 'repository_dispatch'
    env:
      BUCKET: aiweave.org

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python dependencies
        run: pip install requests boto3

      # OIDC credentials are configured before generate_site.py so that
      # the Bedrock client (boto3) can authenticate during README summarization.
      # Required IAM permissions on the role: bedrock:InvokeModel (us-east-1)
      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::239571291755:role/teamweave-github-actions-sam-deployer
          aws-region: us-east-1

      - name: Fetch all .md files and upload to RAG S3 bucket
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
        run: python fetch_md_upload_s3.py

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install Node.js dependencies
        run: npm ci

      - name: Generate index.html
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
        run: npm run build

      - name: Verify index.html was generated
        run: |
          if [ ! -f index.html ]; then
            echo "ERROR: index.html was not generated"
            exit 1
          fi
          echo "index.html size: $(wc -c < index.html) bytes"

      - name: Create S3 bucket if it does not exist
        run: |
          if aws s3api head-bucket --bucket "$BUCKET" 2>/dev/null; then
            echo "Bucket $BUCKET already exists, skipping creation"
          else
            echo "Creating bucket $BUCKET in us-east-1"
            aws s3api create-bucket --bucket "$BUCKET" --region us-east-1
          fi

      - name: Disable S3 Block Public Access
        run: |
          aws s3api put-public-access-block \
            --bucket "$BUCKET" \
            --public-access-block-configuration \
              "BlockPublicAcls=false,IgnorePublicAcls=false,BlockPublicPolicy=false,RestrictPublicBuckets=false"

      - name: Enable S3 static website hosting
        run: |
          aws s3api put-bucket-website \
            --bucket "$BUCKET" \
            --website-configuration '{
              "IndexDocument": {"Suffix": "index.html"},
              "ErrorDocument": {"Key": "index.html"}
            }'

      - name: Set S3 bucket public read policy
        run: |
          POLICY=$(cat <<EOF
          {
            "Version": "2012-10-17",
            "Statement": [{
              "Sid": "PublicReadGetObject",
              "Effect": "Allow",
              "Principal": "*",
              "Action": "s3:GetObject",
              "Resource": "arn:aws:s3:::${BUCKET}/*"
            }]
          }
          EOF
          )
          aws s3api put-bucket-policy --bucket "$BUCKET" --policy "$POLICY"

      - name: Upload index.html
        run: |
          aws s3 cp index.html "s3://${BUCKET}/index.html" \
            --content-type "text/html; charset=utf-8" \
            --cache-control "no-cache, no-store, must-revalidate"

      - name: Upload background.svg
        run: |
          aws s3 cp background.svg "s3://${BUCKET}/background.svg" \
            --content-type "image/svg+xml" \
            --cache-control "public, max-age=86400"
      - name: Upload assets
        run: |
          aws s3 cp assets/ "s3://${BUCKET}/assets/" \
            --recursive \
            --cache-control "public, max-age=86400"

      - name: Upload fonts
        # index.html's @font-face rules (see generate_site.jsx) reference
        # fonts/*.woff2 and .woff — without this step those requests 404 on
        # the live site and every browser silently falls back to the IBM
        # Plex stack, indistinguishable from the custom fonts never having
        # been wired in at all. Explicit --content-type per extension
        # because S3's automatic guess for .woff2/.woff isn't reliable
        # across CLI versions, and Safari in particular rejects a font
        # served with the wrong MIME type.
        run: |
          aws s3 cp fonts/ "s3://${BUCKET}/fonts/" \
            --recursive --exclude "*" --include "*.woff2" \
            --content-type "font/woff2" \
            --cache-control "public, max-age=86400"
          aws s3 cp fonts/ "s3://${BUCKET}/fonts/" \
            --recursive --exclude "*" --include "*.woff" \
            --content-type "font/woff" \
            --cache-control "public, max-age=86400"
          aws s3 cp fonts/ "s3://${BUCKET}/fonts/" \
            --recursive --exclude "*" --include "*.ttf" \
            --content-type "font/ttf" \
            --cache-control "public, max-age=86400"

      - name: Output website URL
        run: |
          echo "Website: http://${BUCKET}.s3-website-us-east-1.amazonaws.com"
          echo "Custom domain (after DNS): https://aiweave.org"

  storybook:
    name: Publish Storybook to aiweave.org/storybook/
    runs-on: ubuntu-latest
    if: github.event_name != 'repository_dispatch'
    env:
      BUCKET: aiweave.org
    # A separate job, not extra steps on the site deploy: a Storybook failure
    # should not stop aiweave.org from shipping, and vice versa. Both are
    # already gated by the Tantu workflow, which builds Storybook and renders
    # every story on each push and pull request.

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # Node 20 reached end of life in April 2026; new jobs start on 22.
          node-version: "22"
          cache: "npm"

      - run: npm ci

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::239571291755:role/teamweave-github-actions-sam-deployer
          aws-region: us-east-1

      # Storybook is served from a subdirectory, so the preview bundle has to
      # be built knowing that. .storybook/main.ts reads this and hands it to
      # Vite as `base`; without it every asset in iframe.html would request
      # /assets/... at the domain root and 404. The manager's own URLs are
      # already relative, so only the preview needs telling.
      - name: Build Storybook for /storybook/
        env:
          STORYBOOK_BASE_PATH: /storybook/
        run: npm run build:storybook

      - name: The build really is rooted at /storybook/
        run: |
          if ! grep -q '"/storybook/assets/' storybook-static/iframe.html; then
            echo "::error::iframe.html does not reference /storybook/assets/ — STORYBOOK_BASE_PATH did not take effect"
            grep -oE 'src="[^"]*"' storybook-static/iframe.html | head
            exit 1
          fi
          echo "preview assets are correctly prefixed"

      # --delete so a removed story does not linger as a stale page. Scoped to
      # the storybook/ prefix, so the site's own objects are untouched.
      - name: Upload
        run: |
          aws s3 sync storybook-static/ "s3://${BUCKET}/storybook/" \
            --delete \
            --cache-control "public, max-age=86400"

      # Fonts and HTML need saying explicitly, for the same reason the site
      # upload does: S3's MIME guess for .woff2/.woff is not reliable across
      # CLI versions and Safari rejects a font served with the wrong type,
      # while the two HTML entry points must not be cached or a deploy is
      # invisible until the browser gives up its copy.
      - name: Re-upload fonts with correct content types
        run: |
          for ext in woff2 woff ttf; do
            aws s3 cp "s3://${BUCKET}/storybook/" "s3://${BUCKET}/storybook/" \
              --recursive --exclude "*" --include "*.${ext}" \
              --content-type "font/${ext}" \
              --cache-control "public, max-age=86400" \
              --metadata-directive REPLACE
          done

      # Every file that *names* other files has to be uncacheable, or a
      # returning reader is served a stale table of contents pointing at
      # bundles that have long since been replaced.
      #
      # index.html names the bundles. index.json is Storybook's story
      # manifest — the manager fetches it to build the sidebar — and
      # project.json carries the refs beside it. Only the HTML was being
      # corrected, so a reader who had opened /storybook/ within the previous
      # day got a fresh page that drew its sidebar from a day-old manifest:
      # new stories were deployed, uploaded, and reachable by direct URL,
      # and simply not listed. Which is indistinguishable, from the outside,
      # from a deploy that never happened.
      - name: Re-upload the files that name other files as no-cache
        run: |
          aws s3 cp "s3://${BUCKET}/storybook/" "s3://${BUCKET}/storybook/" \
            --recursive --exclude "*" --include "*.html" \
            --content-type "text/html; charset=utf-8" \
            --cache-control "no-cache, no-store, must-revalidate" \
            --metadata-directive REPLACE
          for manifest in index.json project.json; do
            aws s3 cp "s3://${BUCKET}/storybook/${manifest}" "s3://${BUCKET}/storybook/${manifest}" \
              --content-type "application/json" \
              --cache-control "no-cache, no-store, must-revalidate" \
              --metadata-directive REPLACE
          done

      # Read it back rather than trusting the write. This is the check whose
      # absence let the stale sidebar ship: every step above reported success
      # while the object that decides what a reader sees kept a day-long TTL.
      - name: The manifest really is uncacheable
        run: |
          for key in index.html index.json project.json; do
            cc=$(aws s3api head-object --bucket "$BUCKET" --key "storybook/${key}" \
                   --query CacheControl --output text)
            echo "storybook/${key}: ${cc}"
            case "$cc" in
              *no-cache*) ;;
              *) echo "::error::storybook/${key} is cacheable (${cc}) — a returning reader will be served a stale index"; exit 1 ;;
            esac
          done

      - name: Output Storybook URL
        run: |
          echo "Storybook: https://${BUCKET}/storybook/"

  playground:
    name: Publish the playground to aiweave.org/playground/
    runs-on: ubuntu-latest
    if: github.event_name != 'repository_dispatch'
    env:
      BUCKET: aiweave.org
    # Its own job for the same reason Storybook has one: three deliverables
    # ship from this repository and a failure in any of them should not hold
    # the other two. Storybook answers "what is in the box"; this answers what
    # it is like to build something with it, which is the question that decides
    # adoption — so it belongs on the domain beside the site, not only on
    # Netlify.

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      # Both projects: the playground is a nested npm project, and the root
      # install is what provides the Tantu source it aliases.
      - run: npm ci
      - run: npm --prefix playground ci

      # No font build step: fonts/ is committed build output, and tantu-ci
      # already fails the branch if what is committed differs from what
      # build.py produces. Rebuilding here would add defcon, ufo2ft and a
      # Python toolchain to a deploy job to reproduce bytes the checkout
      # already has.

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::239571291755:role/teamweave-github-actions-sam-deployer
          aws-region: us-east-1

      # Vite writes absolute asset URLs, so a bundle built for the domain root
      # asks for /assets/... and 404s the moment it is served from /playground/
      # — the HTML loads and nothing but unstyled text appears.
      #
      # Built in the default mode, which aliases Tantu at ../src: this is a
      # demonstration of what the repository does *now*, including components
      # that have not been released yet. The published package is proven
      # separately by `npm run build:npm`, which the verify sweep covers.
      - name: Build the playground for /playground/
        env:
          PLAYGROUND_BASE_PATH: /playground/
        run: npm --prefix playground run build

      - name: The build really is rooted at /playground/
        run: |
          if ! grep -q '"/playground/assets/' playground/dist/index.html; then
            echo "::error::index.html does not reference /playground/assets/ — PLAYGROUND_BASE_PATH did not take effect"
            grep -oE '(src|href)="[^"]*"' playground/dist/index.html | head
            exit 1
          fi
          echo "playground assets are correctly prefixed"

      # --delete so a removed asset does not linger. Scoped to the playground/
      # prefix, so the site's own objects and storybook/ are untouched.
      - name: Upload
        run: |
          aws s3 sync playground/dist/ "s3://${BUCKET}/playground/" \
            --delete \
            --cache-control "public, max-age=86400"

      # Same two corrections the other uploads need: S3's MIME guess for
      # .woff2/.woff is not reliable across CLI versions and Safari rejects a
      # font served with the wrong type, while index.html must not be cached
      # or a deploy stays invisible until the browser gives up its copy.
      - name: Re-upload fonts with correct content types
        run: |
          for ext in woff2 woff ttf; do
            aws s3 cp "s3://${BUCKET}/playground/" "s3://${BUCKET}/playground/" \
              --recursive --exclude "*" --include "*.${ext}" \
              --content-type "font/${ext}" \
              --cache-control "public, max-age=86400" \
              --metadata-directive REPLACE
          done

      - name: Re-upload HTML as no-cache
        run: |
          aws s3 cp "s3://${BUCKET}/playground/" "s3://${BUCKET}/playground/" \
            --recursive --exclude "*" --include "*.html" \
            --content-type "text/html; charset=utf-8" \
            --cache-control "no-cache, no-store, must-revalidate" \
            --metadata-directive REPLACE

      # Same readback as Storybook's. The playground has no runtime manifest —
      # Vite writes the hashed asset names straight into the document — so
      # index.html is the only file that names others, and it is the only one
      # that must never be cached.
      - name: The document really is uncacheable
        run: |
          cc=$(aws s3api head-object --bucket "$BUCKET" --key "playground/index.html" \
                 --query CacheControl --output text)
          echo "playground/index.html: ${cc}"
          case "$cc" in
            *no-cache*) ;;
            *) echo "::error::playground/index.html is cacheable (${cc}) — a returning reader will be served a stale document"; exit 1 ;;
          esac

      - name: Output playground URL
        run: |
          echo "Playground: https://${BUCKET}/playground/"

  sounding:
    name: Publish SOUNDING to aiweave.org/sounding/
    runs-on: ubuntu-latest
    env:
      BUCKET: aiweave.org
    # A fourth deliverable on the same domain, and its own job for the same
    # reason Storybook and the playground have theirs: a failure in one should
    # not hold the others back.
    #
    # The game lives in its own repository (rajatarun/sounding) but deploys
    # from this one, because this is where the bucket's OIDC role is trusted.
    # Putting the job in the game's repository would mean widening that role's
    # trust policy to a second repo — a change to the AWS account, to publish
    # static files it already publishes for three other things.
    #
    # The cost of that choice is the trigger: a push to *this* repo deploys
    # the game, a push to the game's repo does not. Run this workflow manually
    # (workflow_dispatch) after a change over there, or wire a
    # repository_dispatch from it if that becomes tedious.

    steps:
      - name: Check out the game
        uses: actions/checkout@v4
        with:
          repository: rajatarun/sounding
          # Also covers the repository being private; a public checkout would
          # not need it.
          token: ${{ secrets.GH_TOKEN }}
          path: sounding

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: sounding/package-lock.json

      - run: npm ci
        working-directory: sounding

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::239571291755:role/teamweave-github-actions-sam-deployer
          aws-region: us-east-1

      # Same reason the playground needs telling: Vite writes absolute asset
      # URLs, so a root-built bundle asks for /assets/... and 404s under
      # /sounding/, leaving a page that loads and renders nothing.
      - name: Build for /sounding/
        env:
          SOUNDING_BASE_PATH: /sounding/
        run: npm run build
        working-directory: sounding

      - name: The build really is rooted at /sounding/
        run: |
          if ! grep -q '"/sounding/assets/' sounding/dist/index.html; then
            echo "::error::index.html does not reference /sounding/assets/ — SOUNDING_BASE_PATH did not take effect"
            grep -oE '(src|href)="[^"]*"' sounding/dist/index.html | head
            exit 1
          fi
          echo "assets are correctly prefixed"

      # --delete so a removed asset does not linger. Scoped to the sounding/
      # prefix, so the site's own objects, storybook/ and playground/ are
      # untouched.
      - name: Upload
        run: |
          aws s3 sync sounding/dist/ "s3://${BUCKET}/sounding/" \
            --delete \
            --cache-control "public, max-age=86400"

      # The game does not import Tantu's optional typefaces, so this matches
      # nothing today and is a no-op. It stays because the day someone adds a
      # font back, S3's MIME guess for .woff2/.woff is unreliable across CLI
      # versions and Safari rejects a font served with the wrong type — a
      # failure that is silent and looks like the font was never wired in.
      - name: Re-upload fonts with correct content types
        run: |
          for ext in woff2 woff ttf; do
            aws s3 cp "s3://${BUCKET}/sounding/" "s3://${BUCKET}/sounding/" \
              --recursive --exclude "*" --include "*.${ext}" \
              --content-type "font/${ext}" \
              --cache-control "public, max-age=86400" \
              --metadata-directive REPLACE
          done

      - name: Re-upload HTML as no-cache
        run: |
          aws s3 cp "s3://${BUCKET}/sounding/" "s3://${BUCKET}/sounding/" \
            --recursive --exclude "*" --include "*.html" \
            --content-type "text/html; charset=utf-8" \
            --cache-control "no-cache, no-store, must-revalidate" \
            --metadata-directive REPLACE

      # Read it back rather than trusting the write, the same check the other
      # two subdirectory deploys carry. index.html is the only file naming the
      # hashed bundles, so it is the only one that must never be cached.
      - name: The document really is uncacheable
        run: |
          cc=$(aws s3api head-object --bucket "$BUCKET" --key "sounding/index.html" \
                 --query CacheControl --output text)
          echo "sounding/index.html: ${cc}"
          case "$cc" in
            *no-cache*) ;;
            *) echo "::error::sounding/index.html is cacheable (${cc}) — a returning player will be served a stale document"; exit 1 ;;
          esac

      - name: Output the game's URL
        run: |
          echo "SOUNDING: https://${BUCKET}/sounding/"
