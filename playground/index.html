<!doctype html>
<html lang="en" dir="ltr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Tantu Playground</title>

    <!--
      Tantu's stylesheet deliberately ships no @font-face rules — where the
      brand font files live is a consumer's decision, not the design system's.
      This is that wiring. Run `npm run build:fonts` in the repo root once; if
      the files are absent these rules simply fail and every stack falls back
      to IBM Plex, which is what a consumer who has not wired the fonts sees.
    -->
    <style>
      @font-face {
        font-family: "Kasuti-Gauze";
        src: url("/Kasuti-Gauze.woff2") format("woff2");
        font-display: swap;
      }
      @font-face {
        font-family: "Talim-Mono";
        src: url("/Talim-Mono.woff2") format("woff2");
        font-display: swap;
      }
      @font-face {
        font-family: "Kalam-Rupa";
        src: url("/Kalam-Rupa.woff2") format("woff2");
        font-display: swap;
      }
      html, body, #root { height: 100%; margin: 0; }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
