<!doctype html>
<html lang="en" dir="ltr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Tantu Playground</title>

    <!--
      No @font-face here.

      Tantu's stylesheet names no typeface — its components bind to roles that
      resolve to stacks every machine already has — so this app works with no
      font files at all. It opts into the three Tantu faces by importing
      "@aiweave/tantu/fonts.css" in src/App.tsx, next to the stylesheet
      import, which is exactly what a consuming application does. That file is
      generated by `npm run build:fonts` and carries a unicode-range computed
      from each font's real cmap.

      This block used to hand-write the three @font-face rules and point them
      at a public directory, which was a third copy of the same thing and the
      only one missing that range.
    -->
    <style>
      html, body, #root { height: 100%; margin: 0; }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
