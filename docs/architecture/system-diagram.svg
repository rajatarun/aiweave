<text x="630.0" y="392.0" text-anchor="middle" class="det">stock research · reminders · custom routines</text>
<rect class="box-orch" x="820" y="340" width="300" height="80" rx="10"/>
<text x="970.0" y="374.0" text-anchor="middle" class="ttl">TeamWeave</text>
<text x="970.0" y="392.0" text-anchor="middle" class="det">Bedrock agent pipelines</text>
