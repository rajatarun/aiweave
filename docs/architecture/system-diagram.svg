<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1520 1160" role="img" aria-labelledby="dtitle ddesc">
<title id="dtitle">AI Weave platform — request-authorization architecture</title>
<desc id="ddesc">How a click in the tarunraja.info admin UI becomes a committed write: one wallet/SIWE gate decides who may act, one mcp-observatory propose-score-commit gate decides whether the specific action may proceed, shared by the content orchestrator, RoutineWeave, and six other platform services (ToolWeave, CipherWeave, DeviceWeave, ScreenWeave, DeployWeave, DataDictionary) that each verifiably integrate the same contract. TrainWeave feeds DeployWeave in a fine-tuning flywheel but has no gated action of its own. IntentWeave and PromptWeave are reserved repository names with no code yet; their described capability already lives inside other services.</desc>
