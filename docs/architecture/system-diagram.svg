<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1520 950" role="img" aria-labelledby="dtitle ddesc">
<title id="dtitle">AI Weave platform — request-authorization architecture</title>
<desc id="ddesc">How a click in the tarunraja.info admin UI becomes a committed write: one wallet/SIWE gate decides who may act, one mcp-observatory propose-score-commit gate decides whether the specific action may proceed, shared by the content orchestrator, RoutineWeave and the rest of the platform.</desc>
<style>
  svg { color-scheme: dark light; }
  svg {
    --bg: #12100e; --bg-elev: #1a1714;
    --ink: #faf7f0; --ink2: #c8c0b2;
    --line: #6e4a35;
    --gate: #c5a059; --gate-wash: rgba(197,160,89,0.14);
    --indigo: #2b5377;
    --copper: #4c8a63;
    --rust: #d98a2b;
    --block: #d8695a;
  }
  @media (prefers-color-scheme: light) {
    svg {
      --bg: #f3eee2; --bg-elev: #e8e1d0;
      --ink: #12100e; --ink2: #524a42;
      --line: rgba(110,74,53,0.55);
      --gate: #82231d; --gate-wash: rgba(130,35,29,0.09);
      --indigo: #0d233a;
      --copper: #294d34;
      --rust: #945412;
      --block: #82231d;
    }
  }
  .bgrect { fill: var(--bg); }
  .box-gate-auth { fill: var(--bg-elev); stroke: var(--indigo); stroke-width: 2; }
  .box-gate-mcp { fill: var(--gate-wash); stroke: var(--gate); stroke-width: 2.5; }
  .box-iface { fill: var(--bg-elev); stroke: var(--indigo); stroke-width: 1.5; }
  .box-iface-dim { fill: none; stroke: var(--line); stroke-width: 1.5; stroke-dasharray: 4 4; }
  .box-orch { fill: var(--bg-elev); stroke: var(--ink2); stroke-width: 1.5; }
  .box-know { fill: var(--bg-elev); stroke: var(--copper); stroke-width: 1.5; }
  .box-data { fill: var(--bg-elev); stroke: var(--rust); stroke-width: 1.5; }
  .box-sat { fill: none; stroke: var(--line); stroke-width: 1.5; stroke-dasharray: 5 5; }
  .ttl { font: 700 15px ui-sans-serif, Inter, Segoe UI, sans-serif; fill: var(--ink); }
  .ttl-sm { font: 700 13px ui-sans-serif, Inter, Segoe UI, sans-serif; fill: var(--ink); }
  .det { font: 400 11.5px ui-sans-serif, Inter, Segoe UI, sans-serif; fill: var(--ink2); }
  .det-sm { font: 400 10.5px ui-sans-serif, Inter, Segoe UI, sans-serif; fill: var(--ink2); }
  .lane { font: 700 10.5px ui-monospace, SFMono-Regular, monospace; fill: var(--ink2); letter-spacing: 0.08em; }
  .edge { fill: none; stroke: var(--ink2); stroke-width: 1.5; }
  .edge-dashed { fill: none; stroke: var(--ink2); stroke-width: 1.5; stroke-dasharray: 5 4; }
  .edge-block { fill: none; stroke: var(--block); stroke-width: 1.75; stroke-dasharray: 2 4; }
  .lbl { font: 400 10.5px ui-sans-serif, Inter, Segoe UI, sans-serif; fill: var(--ink2); }
  .lbl-block { font: 600 10.5px ui-sans-serif, Inter, Segoe UI, sans-serif; fill: var(--block); }
  .lbl-bg { fill: var(--bg); }
  .head { font: 400 13.5px ui-sans-serif, Inter, Segoe UI, sans-serif; fill: var(--ink2); }
</style>
<rect class="bgrect" x="0" y="0" width="1520" height="950"/>
<defs>
  <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
    <path d="M0,0 L10,5 L0,10 z" fill="var(--ink2)"/>
  </marker>
  <marker id="arrowblock" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
    <path d="M0,0 L10,5 L0,10 z" fill="var(--block)"/>
  </marker>
</defs>
<text x="760.0" y="28" text-anchor="middle" class="ttl" font-size="20">AI Weave — request-authorization architecture</text>
<text x="760.0" y="52" text-anchor="middle" class="head">Two gates, not one: identity decides who may open the admin UI; mcp-observatory decides whether the specific action may commit.</text>
